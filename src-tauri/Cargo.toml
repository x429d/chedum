[package]
name = "chedum"
version = "0.1.0"
default-run = "chedum"
description = "Chedum — native chess analytics studio"
authors = ["Chedum Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chedum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
rusqlite = { version = "0.41", features = ["bundled"] }
shakmaty = "0.30"
pgn-reader = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.test]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
